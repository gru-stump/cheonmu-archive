- id: special-disaster-agency
  documentNumber: WF-01
  title: 특수재난관리청
  categories: [organization]
  status: public
  clearance: 공개 열람
  basisStage: 1
  summary: 미확인 개체와 특수재난을 관리하는 기관.
  explanation: 현장 부서와 의료 부서를 함께 운용하는 특수재난 대응 기관이다.
  sections:
    - revealStage: 1
      paragraphs:
        - 현장 통제와 격리, 구조, 의료 지원을 담당한다.
        - 산하에 현장 대응 부서인 특수기동대, 치료와 관찰을 맡는 의료센터, 그리고 사건을 문서로 남기는 기록 부서를 둔다.
        - 모든 특수재난 사건은 종결 후 기록철에 등재되며, 문서 번호가 붙은 기록만 정식 사건으로 인정된다.
    - revealStage: 5
      paragraphs:
        - 사건 보고서의 측정값과 판정은 사후 정정될 수 있으나, 정정에는 담당 의료인 또는 지휘관의 서명이 필요하다.
  relatedRecords: [first-contact, field-accompaniment]

- id: special-task-force
  documentNumber: WF-02
  title: 특수기동대
  categories: [organization]
  status: public
  clearance: 공개 열람
  basisStage: 1
  summary: 고위험 현장에 투입되는 대응 부서.
  explanation: 무영이 소속된 현장 대응 부서다.
  sections:
    - revealStage: 1
      paragraphs:
        - 지휘관은 철수 순서와 구조 인원의 안전을 확인하며 무영이 현장 지휘를 맡고 있다.
        - 위험 현장에서는 지휘관이 가장 먼저 진입하고 가장 마지막에 철수하는 것이 부대의 오랜 관행이다.
    - revealStage: 3
      paragraphs:
        - 고위험 작전에는 의료 지원 인력이 점검선까지 동행하는 편성이 정착되어 있다.
    - revealStage: 5
      paragraphs:
        - 대원을 대신해 위험 요소에 노출된 지휘관의 사례가 보고되어 있으며, 해당 인원의 현장 복귀는 의료 판정을 따른다.
  relatedRecords: [first-contact, field-accompaniment, fracture]

- id: third-medical-center
  documentNumber: WF-03
  title: 제3의료센터
  categories: [medical]
  status: public
  clearance: 공개 열람
  basisStage: 1
  summary: 특수재난 부상자와 오염 노출자를 치료하고 관찰하는 의료 기관.
  explanation: 천령이 근무하며 무영의 치료가 반복되는 곳이다.
  sections:
    - revealStage: 1
      paragraphs:
        - 천령이 의사이자 연구원으로 소속되어 현장 의료 지원에도 참여한다.
    - revealStage: 2
      paragraphs:
        - 반복 내원하는 환자에게는 전담 의사가 배정된다. 전담 배정은 공식 제도라기보다 반복되는 배정이 굳어진 관행에 가깝다.
        - 적성 등록자(WF-10)는 회복이 빨라 외상 징후가 조기에 가려진다. 여기에 자각 증상의 축소 보고가 겹치면 중증이 늦게 발견되는 사례가 반복되어, 적성자 반복 내원자에게는 전담 의사의 지속 관찰이 권장된다.
    - revealStage: 5
      paragraphs:
        - 일부 치료 기록은 담당 의료인 전담으로 잠기며, 다른 의료진은 열람할 수 없다. 전담 잠금의 사유는 차트에 남지 않는다.
  relatedRecords: [first-contact, repeated-treatment, fracture]

- id: containment-protocol
  documentNumber: WF-04
  title: 격리 및 철수 절차
  categories: [field-response]
  status: public
  clearance: 공개 열람
  basisStage: 1
  summary: 미확인 개체가 관측된 현장은 격리선을 기준으로 통제된다.
  explanation: 현장 인원을 살리기 위한 절차이며 두 사람의 판단이 자주 부딪치는 지점이다.
  sections:
    - revealStage: 1
      paragraphs:
        - 의료진도 철수 명령의 대상이지만 현장 판단과 충돌한 사례가 존재한다.
        - 격리문은 다중 잠금쇠 구조이며, 마지막 잠금의 확인은 현장 지휘관의 몫이다. 격리선 안에 인원이 남은 상태의 폐쇄는 지휘관 권한으로만 가능하다.
    - revealStage: 5
      paragraphs:
        - 오염 농도가 철수 기준을 넘으면 전 인원 철수가 원칙이다. 기준 초과 후 잔류한 인원은 사후 보고 대상이 되지만, 실제로 보고까지 이어진 사례는 드물다.
  relatedRecords: [first-contact, field-accompaniment, fracture]

- id: contamination-treatment
  documentNumber: WF-05
  title: 오염과 치료
  categories: [anomaly]
  status: partial
  clearance: 부분 공개
  basisStage: 5
  summary: 오염은 일반 외상과 구분해 다뤄진다.
  explanation: 특수재난 현장의 부상은 상처만 치료한다고 끝나지 않는다.
  sections:
    - revealStage: 1
      paragraphs:
        - 노출 정도에 따라 장비 측정과 의료 관찰이 이루어진다.
        - 오염은 열상이나 골절과 달리 노출 직후에는 겉으로 드러나지 않는 경우가 있어, 무증상 인원도 관찰 기간을 거친다.
    - revealStage: 5
      paragraphs:
        - 치료 방식과 일부 회복 사례는 제한 정보로 분류되어 있다.
        - 고농도 오염 물질은 검은 액상으로 관측되며, 접촉한 구조물 표면을 하얗게 일으키고 방호복 섬유를 침식한 사례가 있다.
        - 오염 강도 측정값이 사후 하향 정정된 사건이 존재한다. 정정 사유는 초기 계측 오류로 기재되어 있다.
  relatedRecords: [first-contact, fracture]

- id: unidentified-entities
  documentNumber: WF-06
  title: 미확인 개체
  categories: [anomaly]
  status: partial
  clearance: 부분 공개
  basisStage: 5
  summary: 격리와 제압의 대상이 되는 미확인 개체에 관한 개요.
  explanation: 특수재난의 원인이 되는 존재들로, 관측되는 즉시 격리선이 설정된다.
  sections:
    - revealStage: 1
      paragraphs:
        - 미확인 개체는 형태와 성질이 일정하지 않아 개별 사건 단위로 분류된다. 관측 즉시 격리선이 설정되고 민간인 접근이 통제된다.
        - 제압보다 격리가 우선이며, 제압은 격리 유지가 불가능하다고 판단된 경우에만 승인된다.
        - 사건이 누적되며 대응 규모를 기준으로 한 등급 체계(WF-09)와 행동 경향 묶음(OB-03)이 도입되었다. 두 체계 모두 개체의 정체를 분류하지 않는다 — 개체는 여전히 개별 사건 단위로만 다뤄진다.
    - revealStage: 5
      paragraphs:
        - 폐쇄 시설에 장기간 머문 개체는 내부에 오염 물질을 축적하며, 제압 과정에서 이를 방출한 사례가 보고되어 있다.
  relatedRecords: [first-contact, fracture]

- id: medical-field-attachment
  documentNumber: WF-07
  title: 현장 의료 지원 배속
  categories: [field-response]
  status: public
  clearance: 공개 열람
  basisStage: 3
  summary: 의료센터 인력이 현장 작전에 배속되는 제도.
  explanation: 치료실의 의사가 현장까지 나오게 된 제도적 배경이다.
  sections:
    - revealStage: 1
      paragraphs:
        - 초기에는 부상자를 후방 치료 시설로 이송하는 것이 원칙이었다. 그러나 이송 중 상태가 악화되는 사례가 누적되며 의료 인력의 현장 배속이 도입되었다.
        - 배속 제도가 도입되기 전, 격리선 설정 이후의 구역에 잔류해 이뤄진 비공식 구조가 초기 기록에 드물게 남아 있다. 해당 사례의 다수는 구조자의 소속이 확인되지 않은 채 종결되었다.
    - revealStage: 3
      paragraphs:
        - 배속 의료 인력은 통제선 밖 점검선에 위치하며, 철수 명령의 적용 대상이다. 다만 환자 발생 시 의료적 판단과 지휘 판단의 우선순위는 명문화되어 있지 않다.
        - 특정 부대와 특정 의료인의 배속 조합이 반복되는 경우, 편성 담당은 이를 관행으로 존중하는 편이다.
  relatedRecords: [field-accompaniment, the-one-who-stayed]

- id: personnel-registry
  documentNumber: WF-08
  title: 인사 기록과 등록 제도
  categories: [organization]
  status: partial
  clearance: 부분 공개
  basisStage: 5
  summary: 특재청 소속 인원의 등록과 기록 관리에 관한 제도.
  explanation: 소속 인원의 이력이 어떻게 기록되고, 어떤 기록이 잠기는지에 대한 문서다.
  sections:
    - revealStage: 1
      paragraphs:
        - 모든 소속 인원은 등록 절차를 거치며, 인사 기록과 의무 기록이 함께 관리된다. 현장 인원의 부상 이력은 의무 기록에 누적된다.
    - revealStage: 5
      paragraphs:
        - 일부 인원의 등록 기록에서 불일치가 보고되어 해당 기록은 제한 문서로 이관되었다. 이관 사유는 공개되지 않는다.
  relatedRecords: [repeated-treatment, fracture]

- id: entity-response-grades
  documentNumber: WF-09
  title: 개체 대응 등급
  categories: [field-response]
  status: public
  clearance: 공개 열람
  basisStage: 1
  summary: 격리 유지에 필요한 대응 규모를 기준으로 한 네 단계 등급.
  explanation: 등급은 개체가 아니라 사건에 붙으며, 필요한 대응의 크기를 말한다.
  sections:
    - revealStage: 1
      paragraphs:
        - 대응 등급은 개체의 정체나 위험성 평가가 아니라, 격리 유지에 필요한 인력과 통제 범위에 붙는다. 같은 개체라도 재평가에 따라 등급이 오르내린다.
        - 관(觀)급은 격리선 설정과 정기 관측만을 유지한다. 계(戒)급은 단일 구역 통제와 민간인 소개를 동반하는 표준 격리 대응이다.
        - 위(危)급은 인접 구역 소개와 의료 지원 인력 배속이 의무화되는 확장 통제 단계다. 제압 검토는 위급에서만 승인된다.
        - 멸(滅)급은 광역 상실을 전제로 한 최상위 등급이다. 제도 시행 이후 지정된 사례가 없으며, 지정 요건과 대응 절차는 제한 문서로 이관되어 있다.
    - revealStage: 5
      paragraphs:
        - 위급 사건에서는 제압 과정의 오염 방출이 반복적으로 보고되어, 제압 승인에는 의료 부서의 사전 검토가 포함된다.
  relatedRecords: [first-contact, fracture, the-one-who-stayed]

- id: behavior-patterns
  documentNumber: OB-03
  title: 행동 경향 관측 묶음
  categories: [observation]
  status: partial
  clearance: 부분 공개
  basisStage: 5
  summary: 반복 보고에서 사후적으로 묶인 개체 행동의 세 가지 경향.
  explanation: 공식 분류가 아니라, 보고서에 반복 등장하는 서술을 정리한 것이다.
  sections:
    - revealStage: 1
      paragraphs:
        - 반복 보고에서 세 가지 경향이 사후적으로 묶였다. 정주형은 폐쇄 시설에 머무르며 움직이지 않는다. 배회형은 격리 구역 안을 일정하지 않은 간격으로 이동한다. 돌파형은 구조물과 격리 설비를 반복해서 타격한다.
        - 배회형 개체가 음원에 접근하는 반응이 여러 현장에서 보고되었다. 격리 구역 내 구조 활동에서 소음 통제가 권고되는 근거다.
    - revealStage: 5
      paragraphs:
        - 하나의 사건에서 경향을 넘나드는 개체가 보고된 뒤, 경향 묶음을 예측 도구로 쓰지 않도록 명시되었다.
        - 대원들이 붙인 비공식 별칭이 보고서 여백에 남는 관행이 있다. 별칭은 색인되지 않으며, 같은 별칭이 서로 다른 사건에서 반복될 때만 참고된다.
  relatedRecords: [first-contact, fracture, the-one-who-stayed]

- id: aptitude-registry
  documentNumber: WF-10
  title: 적성 판정과 등록
  categories: [organization]
  status: public
  clearance: 공개 열람
  basisStage: 1
  summary: 통상 범위를 넘는 신체 적성을 판정하고 등록하는 제도.
  explanation: 특수기동대 같은 현장 부서의 선발이 이 판정 위에 서 있다.
  sections:
    - revealStage: 1
      paragraphs:
        - 일부 인원에게서 감각, 지구력, 회복이 통상 범위를 웃도는 신체 적성이 확인된다. 적성이 언제부터 나타났는지에 대한 합의된 기록은 없다.
        - 적성은 판정 절차를 거쳐 등록되며, 특수기동대를 비롯한 현장 부서의 선발 요건에 포함된다. 현장 지휘관급 인원은 대부분 적성 등록자다.
        - 적성의 원인은 확정되지 않았다. 유전과 훈련으로 설명되지 않는 발현 사례가 보고되어 연구가 계속되고 있다.
    - revealStage: 5
      paragraphs:
        - 판정 절차에서 판정 불능으로 분류된 사례가 소수 존재한다. 계측 오류로 종결된 건이 대부분이며, 반복 판정 불능 기록은 제한 문서로 이관된다.
  relatedRecords: [first-contact, fracture]

- id: collected-folklore
  documentNumber: OB-04
  title: 채록 설화의 반복 존재
  categories: [observation]
  status: partial
  clearance: 부분 공개
  basisStage: 5
  summary: 각지에서 채록된 오래된 이야기에 같은 존재들이 반복해서 등장한다.
  explanation: 이야기 속에만 있다고 하기에는, 서로 모르는 이야기들이 너무 닮아 있다.
  sections:
    - revealStage: 1
      paragraphs:
        - 기관은 재난 기록 사업의 일환으로 각지의 오래된 이야기를 채록해 왔다. 시대와 지역이 다른 이야기들에 비슷한 존재가 반복해서 등장한다.
        - 반복되는 모티프 가운데 가장 흔한 것은 두 가지다. 부르면 안 되는 것에 대한 경고, 그리고 죽을 자리에서 낯선 이에게 구해져 살아 돌아왔다는 이야기. 구전 설화의 전형적 모티프로 설명되어 있다.
    - revealStage: 5
      paragraphs:
        - 설화 속 존재와 미확인 개체를 같은 것으로 보는 견해가 제기되었으나 채택되지 않았다. 경고 설화의 서술과 일부 사건 보고가 유사하다는 지적만 각주로 남아 있다.
        - 근래의 사건 보고와 특정 설화의 서술이 세부까지 일치한 사례가 있어, 해당 대조표는 색인에서 제외되고 제한 문서로 이관되었다.
  relatedRecords: [the-one-who-stayed]

- id: undated-structures
  documentNumber: WF-11
  title: 연대 불명 구조물
  categories: [anomaly]
  status: partial
  clearance: 부분 공개
  basisStage: 5
  summary: 축조 연대를 확정할 수 없는 구조물이 도시 지하와 외곽에서 확인된다.
  explanation: 지금의 도시는, 언제 지어졌는지 모르는 것들 위에 서 있다.
  sections:
    - revealStage: 1
      paragraphs:
        - 재개발과 지반 정비 과정에서 축조 연대를 확정할 수 없는 구조물이 드러나는 사례가 있다. 현행 공법 및 자재 대장과 일치하지 않으며, 발견 즉시 보고가 의무화되어 있다.
    - revealStage: 5
      paragraphs:
        - 폐쇄 시설형 사건 다수가 이러한 구조물과 겹친 위치에서 발생했다. 오염 방출로 종결된 지하 정수장 사건의 시설 역시 연대 불명 구조물 위에 증축된 것으로 사후 확인되었다.
        - 장기 정주 개체와 구조물의 상관은 판단이 유보되어 있다. 일부 구조물 내부에서 판독되지 않는 표기가 확인되어 해당 기록은 제한 문서로 이관되었다.
  relatedRecords: [fracture]

- id: field-customs
  documentNumber: OB-05
  title: 격리선 안의 관습
  categories: [observation]
  status: partial
  clearance: 부분 공개
  basisStage: 5
  summary: 규정에 없지만 대원들 사이에서 지켜지는 격리 구역 안의 습속.
  explanation: 아무도 이유를 설명하지 않지만, 아무도 어기지 않는다.
  sections:
    - revealStage: 1
      paragraphs:
        - 격리선 안에서는 이름을 크게 부르지 않는다. 두드리는 소리에 응답하지 않는다. 어느 규정에도 없는 습속이지만, 신입 대원은 이유를 묻기 전에 먼저 배운다.
        - 조마다 출동 전에 지키는 사소한 관습이 있다. 기록으로 남기지 않는 것이 관습의 일부다.
    - revealStage: 5
      paragraphs:
        - 습속 다수가 채록 설화의 경고 모티프(OB-04)와 겹친다는 대조 결과가 있다. 습속이 미신이 아니라 잊힌 지침의 잔재라는 견해가 각주로 남아 있다.
        - 두드림에 응답하지 않는 습속은 격리 구역 응답 규칙이 개정되기 전부터 존재했다. 규정이 습속을 뒤늦게 따라온 사례로 기록되어 있다.
  relatedRecords: [the-one-who-stayed, first-contact]

- id: response-behavior-protocol
  documentNumber: WF-12
  title: 응답 행위 대응 지침
  categories: [field-response]
  status: public
  clearance: 공개 열람
  basisStage: 5
  summary: 격리선에 침입해 개체에 접촉을 시도하는 집단에 대한 대응 지침.
  explanation: 부르면 안 되는 것을, 일부러 부르는 사람들이 있다.
  sections:
    - revealStage: 1
      paragraphs:
        - 격리선 침입 사건 가운데 개체에 대한 접촉 시도가 목적인 사례가 반복 확인된다. 두드림에 응답하는 행위, 음원 유인 장비의 설치, 격리 설비의 고의 개방 시도가 대표 유형이며, 통칭 응답 행위로 분류된다.
        - 응답 행위자는 조직적으로 움직이는 사례가 많다. 스스로를 부르는 이름은 확인되지 않았으며, 내부 보고서는 이들을 응답회로 통칭한다.
        - 응답 행위자와의 단독 접촉은 금지된다. 확인 즉시 인계하고, 이들이 남긴 표식과 장비는 만지지 않고 보고한다.
    - revealStage: 5
      paragraphs:
        - 응답회 관계자가 미공표 사건 정보를 사전에 인지하고 있던 정황이 복수 건 보고되었다. 정보 경로는 확인되지 않았다.
        - 상위 등급 사건의 발생 시기와 응답회 활동의 상관을 지적한 보고가 있으나, 인과는 판단이 유보되어 있다.
  relatedRecords: []

- id: recurring-anomalies
  documentNumber: OB-01
  title: 반복 관측 이상
  categories: [observation]
  status: partial
  clearance: 부분 공개
  basisStage: 5
  summary: 서로 다른 현장에서 같은 종류의 이상이 반복되고 있다.
  explanation: 원인을 확정하지 않고 기록철에서 관측된 사실만 연결한다.
  sections:
    - revealStage: 1
      paragraphs: [천령의 낮은 체온과 불안정한 측정값이 기록되었다.]
    - revealStage: 3
      paragraphs: [현장 의료 지원 중에도 설명하기 어려운 반응이 반복되었다.]
    - revealStage: 5
      paragraphs: [심각한 오염과 치료 이후 일부 보고 수치가 정정되었다.]
  relatedRecords: [first-contact, field-accompaniment, fracture]

- id: medic-outside-ward
  documentNumber: OB-02
  title: 치료실 밖의 의료관
  categories: [observation]
  status: partial
  clearance: 부분 공개
  basisStage: 5
  summary: 현장에 배속된 의료관에 대한 대원들의 관측 모음.
  explanation: 공식 판정이 아니라, 함께 현장에 선 사람들이 남긴 관측 기록이다.
  sections:
    - revealStage: 3
      paragraphs:
        - 경보음과 진동에 반응하지 않는 태연함이 여러 대원에 의해 관측되었다. 응급 의료 경력에 따른 둔감화로 설명되어 있다.
        - 현장 기준을 웃도는 처치 속도가 기록되었다. 보조 인력이 손을 따라가지 못한 사례가 복수 존재하며, 숙련도로 설명되어 있다.
    - revealStage: 5
      paragraphs:
        - 철수 기준 초과 후에도 처치 위치를 지킨 사례가 있다. 해당 건은 보고되지 않았다.
        - 중증 환자의 집중 치료 이후 담당 의료관에게서 뚜렷한 소모가 관측되었다. 사흘간 병상을 떠나지 않은 근무 기록이 남아 있다.
  relatedRecords: [field-accompaniment, fracture]

- id: repeated-targeting
  documentNumber: CL-02
  title: 반복 표적화 관측 보고
  categories: [classified]
  status: locked
  clearance: 제한 열람
  basisStage: 5
  summary: 일부 상위 등급 사건에서 자극 반응으로 설명되지 않는 행동이 확인되었다.
  explanation: 개체가 배우고, 피하고, 부른다는 보고들이다.
  sections:
    - revealStage: 1
      paragraphs: [일부 위급 사건에서 자극 반응만으로 설명되지 않는 행동 순서가 보고되었다.]
    - revealStage: 5
      paragraphs:
        - 위급 사건 복수 건에서 학습·회피·유인에 해당하는 행동이 확인되었다. 순찰 조명의 주기에 맞춘 이동, 격리문 잠금 절차의 간격을 노린 타격이 대표 사례다.
        - 구조 신호를 모사한 두드림이 관측된 사례가 있다. 해당 보고 이후 격리 구역 내 응답 규칙이 개정되었다.
  relatedRecords: [fracture, the-one-who-stayed]
  lockLabel: 대응 지침 개정 후 해금

- id: pre-reconstruction-fragments
  documentNumber: CL-03
  title: 재건기 이전 기록 단편
  categories: [classified]
  status: locked
  clearance: 제한 열람
  basisStage: 5
  summary: 기관이 보관한 가장 오래된 문서군은 연대 불명의 단편이다.
  explanation: 지금의 세계가 무엇의 뒤에 세워졌는지에 대한, 확인되지 않는 조각들이다.
  sections:
    - revealStage: 1
      paragraphs: [기관이 보관한 가장 오래된 문서군은 연대 불명의 단편으로, 상호 교차 검증이 불가능해 정식 기록으로 인정되지 않는다.]
    - revealStage: 5
      paragraphs:
        - 단편들은 광역 상실기의 존재를 시사한다. 현재 문명이 소수 생존 집단의 재건에서 비롯했다는 해석이 있으나, 이를 확정할 기록은 남아 있지 않다. 단편들에는 그 시기를 가리키는 합의된 명칭조차 남아 있지 않다.
        - 단편 다수가 같은 대상을 서로 다른 말로 가리키는 것으로 보인다. 형태에 대한 서술은 남아 있지 않고, 규모와 침묵에 대한 묘사만 반복된다.
        - 멸(滅)급 대응 기준은 이 단편들에서 유래했다. 문서 번호가 붙은 기록만 정식 사건으로 인정하는 현행 기록 제도 역시 같은 시기의 교훈에서 비롯했다는 견해가 기관 내부에 있다.
  relatedRecords: [the-one-who-stayed]
  lockLabel: 연대 확정 전 열람 제한

- id: founding-record-gaps
  documentNumber: CL-04
  title: 창설기 기록의 공백
  categories: [classified]
  status: locked
  clearance: 제한 열람
  basisStage: 5
  summary: 기관 창설기의 인사·자원 기록에 설명되지 않는 공백이 있다.
  explanation: 이 기관을 세운 사람들의 이름이, 기관의 기록에서 지워져 있다.
  sections:
    - revealStage: 1
      paragraphs: [창설기 인사 기록의 일부가 일괄 말소되어 있다. 말소 절차의 승인자 역시 기록에 남아 있지 않다.]
    - revealStage: 5
      paragraphs:
        - 재건 초기의 자원 배분을 주도한 집단이 존재했음을 시사하는 문서가 남아 있다. 해당 집단의 이름은 문서마다 다르게 등장하며, 이후 일괄 말소되었다. 말소를 피한 각주 하나에 수계(守契)라는 표기가 반복된다.
        - 말소된 이름들과 관련된 계좌·법인 일부가 응답 행위 관련 집단(WF-12)의 자금 흐름과 교차한 정황이 있다. 조사는 승인되지 않았다.
        - 지켜야 할 약속이 있다는 문장이 서로 다른 시기의 단편에서 같은 형태로 발견되었다. 약속의 상대와 내용은 어느 기록에도 남아 있지 않다.
  relatedRecords: []
  lockLabel: 조사 승인 전 열람 제한

