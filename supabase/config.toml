project_id = "cheonmu-narrative"

[auth]
# This disables signup in the local auth emulator. Hosted projects must also
# disable "Enable signups" in the Supabase Dashboard; no hosted credentials
# or project secrets belong in this repository.
enable_signup = false

[functions.generate-draft]
# Runtime JWT verification would intercept authentication failures before the
# exact-origin handler can apply its fail-closed browser policy.
verify_jwt = false

[functions.review-draft]
# The function validates the bearer token against Supabase Auth itself.
verify_jwt = false

[functions.run-schedules]
# Cron authenticates with the dispatch secret; browser access is authenticated
# explicitly by the handler before it evaluates or queues anything.
verify_jwt = false

[functions.manage-settings]
# Secret writes authenticate the owner inside the function before the
# service-only Vault RPC is invoked.
verify_jwt = false
